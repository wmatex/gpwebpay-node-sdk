name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typeckeck

      - name: Test
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Archive production artifacts
        run: |
          mkdir -p release-artifacts
          zip -r release-artifacts/build.zip dist package.json README.md LICENSE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
